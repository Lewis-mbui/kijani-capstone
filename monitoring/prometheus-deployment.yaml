apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: kijani-staging
  labels:
    app: prometheus
spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      serviceAccountName: prometheus

      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.2

          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus

          ports:
            - name: web
              containerPort: 9090

          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
