apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: kijani-staging

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: kijani-staging
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: kijani-staging
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: kijani-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
