---
- name: Configure KijaniKiosk environment
  hosts: localhost
  gather_facts: false

  vars:
    dockerhub_username: "{{ lookup('env', 'DOCKERHUB_USERNAME') }}"
    dockerhub_token: "{{ lookup('env', 'DOCKERHUB_TOKEN') }}"
    target_environment: "{{ deploy_env | default('staging') }}"

  pre_tasks:
    - name: Validate requested environment
      ansible.builtin.assert:
        that:
          - target_environment in ['staging', 'production']
        fail_msg: >-
          Unsupported environment '{{ target_environment }}'.
          Use staging or production.

    - name: Load environment-specific variables
      ansible.builtin.include_vars:
        file: "group_vars/{{ target_environment }}.yml"

    - name: Set target namespace
      ansible.builtin.set_fact:
        target_namespace: >-
          {{
            staging_namespace
            if target_environment == 'staging'
            else production_namespace
          }}

    - name: Discover Minikube host gateway
      ansible.builtin.shell: |
        set -o pipefail
        minikube ssh -- "ip route show default" | awk '{print $3}'
      args:
        executable: /bin/bash
      register: minikube_host_gateway
      changed_when: false
      when: target_environment == 'staging'

    - name: Add local S3 endpoint to staging configuration
      ansible.builtin.set_fact:
        kk_payments_config: >-
          {{
            kk_payments_config
            | combine({
                'S3_ENDPOINT':
                  'http://' ~
                  (minikube_host_gateway.stdout | trim) ~
                  ':4570'
              })
          }}
      when: target_environment == 'staging'

    - name: Validate Docker Hub credentials are available
      ansible.builtin.assert:
        that:
          - dockerhub_username | length > 0
          - dockerhub_token | length > 0
        fail_msg: >-
          DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be exported
          before running this playbook.
      no_log: true

  tasks:
    - name: Verify target namespace exists
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ target_namespace }}"
      register: namespace_info

    - name: Fail if Terraform has not provisioned target namespace
      ansible.builtin.assert:
        that:
          - namespace_info.resources | length == 1
        fail_msg: >-
          Namespace {{ target_namespace }} does not exist.
          Provision infrastructure with Terraform before running Ansible.

    - name: Configure kk-payments ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: kk-payments-config
            namespace: "{{ target_namespace }}"
            labels:
              app: kk-payments
              environment: "{{ target_environment }}"
              managed-by: ansible
          data: "{{ kk_payments_config }}"

    - name: Configure Docker Hub image pull secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: kijani-registry-credentials
            namespace: "{{ target_namespace }}"
            labels:
              app: kk-payments
              environment: "{{ target_environment }}"
              managed-by: ansible
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: >-
              {{
                {
                  'auths': {
                    'https://index.docker.io/v1/': {
                      'username': dockerhub_username,
                      'password': dockerhub_token,
                      'auth': (dockerhub_username ~ ':' ~ dockerhub_token) | b64encode
                    }
                  }
                }
                | to_json
                | b64encode
              }}
      no_log: true
